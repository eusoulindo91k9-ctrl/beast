<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVFLIX - Filmes e Séries</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #141414;
            --bg-card: #2f2f2f;
            --primary: #e50914;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --modal-bg: #181818;
            --overlay: rgba(0,0,0,0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--primary) #333; }

        body {
            background-color: var(--bg-body);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- NAVBAR --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 4%;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 100; transition: background 0.4s;
        }
        nav.black { background-color: #000; }

        .logo { font-size: 2rem; font-weight: 800; cursor: pointer; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .logo .jv { color: #fff; }
        .logo .flix { color: var(--primary); }

        .search-box { display: flex; align-items: center; }
        .search-box input {
            background: rgba(0,0,0,0.7); border: 1px solid #555;
            color: #fff; padding: 8px 15px; border-radius: 4px; outline: none;
            width: 200px; transition: width 0.3s;
        }
        .search-box input:focus { width: 280px; border-color: var(--primary); }

        /* --- CONTAINER PRINCIPAL --- */
        #app-container {
            padding-top: 80px;
            min-height: 100vh;
        }

        /* --- LOADING SPINNER --- */
        .loader {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite; z-index: 2000;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* --- HOME & LISTAS --- */
        .section-title { font-size: 1.5rem; font-weight: 600; margin: 20px 4% 10px 4%; border-left: 4px solid var(--primary); padding-left: 10px; }
        
        .slider-container {
            padding: 0 4% 30px 4%;
            display: flex; gap: 15px; overflow-x: auto; scroll-behavior: smooth;
        }
        
        .card {
            flex: 0 0 160px; height: 240px; position: relative;
            border-radius: 4px; overflow: hidden; cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            background: #222;
        }
        .card:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 2; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card .quality {
            position: absolute; top: 5px; right: 5px;
            background: var(--primary); color: #fff; font-size: 0.7rem;
            padding: 2px 6px; border-radius: 2px; font-weight: bold;
        }
        .card .year {
            position: absolute; bottom: 5px; left: 5px;
            background: rgba(0,0,0,0.7); font-size: 0.75rem;
            padding: 2px 5px; border-radius: 2px;
        }

        /* --- TELA DE DETALHES (MODERNA) --- */
        .details-view {
            display: none;
            position: relative; width: 100%; min-height: 85vh;
            padding: 40px 4%;
        }
        
        .details-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(20px) brightness(0.3); z-index: -1;
        }

        .details-content {
            display: flex; gap: 40px; max-width: 1200px; margin: 0 auto;
            position: relative; z-index: 10; animation: fadeIn 0.5s;
        }

        .poster-wrapper { flex: 0 0 300px; }
        .poster-big { width: 100%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        .info-wrapper { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .media-title { font-size: 3rem; font-weight: 800; margin-bottom: 10px; line-height: 1.1; }
        .meta-data { display: flex; gap: 15px; margin-bottom: 20px; color: #ccc; font-size: 0.9rem; align-items: center;}
        .imdb-badge { background: #f5c518; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .description { font-size: 1.1rem; line-height: 1.6; color: #ddd; margin-bottom: 30px; max-width: 800px; }

        .btn-action {
            padding: 12px 30px; border-radius: 4px; border: none; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; display: inline-flex; align-items: center; gap: 10px; transition: 0.2s; width: fit-content;
        }
        .btn-play { background: var(--primary); color: #fff; }
        .btn-play:hover { background: #b2070f; transform: scale(1.05); }
        .btn-back { background: rgba(255,255,255,0.2); color: #fff; margin-right: 15px; }
        .btn-back:hover { background: rgba(255,255,255,0.3); }

        .episodes-area { margin-top: 40px; width: 100%; }
        .ep-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;
            max-height: 400px; overflow-y: auto; padding-right: 10px;
        }
        .ep-card {
            background: rgba(255,255,255,0.1); padding: 15px; border-radius: 6px;
            cursor: pointer; transition: 0.2s; border: 1px solid transparent;
            display: flex; flex-direction: column; gap: 5px;
        }
        .ep-card:hover { background: rgba(255,255,255,0.2); transform: translateY(-3px); }
        .ep-card.active { border-color: var(--primary); background: rgba(229, 9, 20, 0.2); }
        .ep-name { font-weight: bold; font-size: 0.95rem; }
        
        /* --- PLAYER MODAL --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 3000;
        }
        .close-player {
            position: absolute; top: 20px; right: 20px; color: #fff;
            font-size: 2rem; cursor: pointer; z-index: 3001; text-shadow: 0 0 5px #000;
        }
        .player-frame { width: 100%; height: 100%; border: none; }

        @media(max-width: 768px) {
            .details-content { flex-direction: column; align-items: center; }
            .poster-wrapper { flex: 0 0 auto; width: 200px; margin-bottom: 20px; }
            .media-title { font-size: 2rem; text-align: center; }
            .meta-data, .description { text-align: center; justify-content: center; }
            .ep-grid { grid-template-columns: 1fr; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="logo" onclick="goHome()">
            <span class="jv">JV</span><span class="flix">FLIX</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquisar (p=...)" autocomplete="off">
        </div>
    </nav>

    <div class="loader" id="loader"></div>

    <div id="app-container"></div>

    <div id="details-view" class="details-view">
        <div class="details-bg" id="detailsBg"></div>
        <div class="details-content">
            <div class="poster-wrapper">
                <img src="" alt="Poster" class="poster-big" id="detPoster">
            </div>
            <div class="info-wrapper">
                <h1 class="media-title" id="detTitle">Titulo</h1>
                <div class="meta-data">
                    <span id="detYear"></span>
                    <span class="imdb-badge" id="detImdb"></span>
                    <span id="detType"></span>
                </div>
                <p class="description" id="detDesc"></p>
                <div id="action-area"></div>
                <div class="episodes-area" id="episodesArea" style="display: none;">
                    <h3>Episódios Disponíveis</h3><br>
                    <div class="ep-grid" id="epList"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="playerModal">
        <span class="close-player" onclick="closePlayer()">×</span>
        <iframe class="player-frame" id="iframePlayer" allowfullscreen></iframe>
    </div>

    <script>
        const API_BASE = 'https://apijvflix.vercel.app';
        
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('p')) {
                const query = params.get('p');
                document.getElementById('searchInput').value = query;
                doSearch(query);
            } else if (params.has('view') && params.get('view') === 'info' && params.has('url')) {
                loadDetails(params.get('url'));
            } else {
                loadHome();
            }
        };

        window.onpopstate = () => location.reload();
        window.onscroll = () => document.getElementById('navbar').classList.toggle('black', window.scrollY > 50);

        function updateUrl(key, value) {
            const url = new URL(window.location);
            url.searchParams.set(key, value);
            if(key === 'p') { url.searchParams.delete('view'); url.searchParams.delete('url'); }
            if(key === 'view') { url.searchParams.delete('p'); }
            window.history.pushState({}, '', url);
        }

        function goHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('searchInput').value = '';
            document.getElementById('details-view').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            loadHome();
        }

        async function fetchApi(endpoint) {
            showLoader(true);
            try {
                const res = await fetch(`${API_BASE}${endpoint}`);
                const data = await res.json();
                showLoader(false);
                return data;
            } catch (error) {
                console.error("Erro API:", error);
                showLoader(false);
                return null;
            }
        }

        // --- CORREÇÃO AQUI: LER O JSON ANINHADO ---
        async function loadHome() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            
            const data = await fetchApi('/v1/get/recommeds');
            
            if (!data) return;

            // Renderiza Filmes
            if (data.movies) {
                if(data.movies.releases && data.movies.releases.length > 0) 
                    createSection('Filmes - Lançamentos', data.movies.releases);
                
                if(data.movies.trending && data.movies.trending.length > 0) 
                    createSection('Filmes - Em Alta', data.movies.trending);
            }

            // Renderiza Séries
            if (data.series) {
                if(data.series.releases && data.series.releases.length > 0) 
                    createSection('Séries - Lançamentos', data.series.releases);
                
                if(data.series.trending && data.series.trending.length > 0) 
                    createSection('Séries - Em Alta', data.series.trending);
            }
        }

        function createSection(title, items) {
            const container = document.getElementById('app-container');
            
            const sectionHtml = `
                <div class="section-title">${title}</div>
                <div class="slider-container">
                    ${items.map(item => `
                        <div class="card" onclick="onItemClick('${item.url}')">
                            <img src="${item.thumb}" alt="${item.title}" loading="lazy">
                            ${item.quality ? `<span class="quality">${item.quality}</span>` : ''}
                            ${item.year ? `<span class="year">${item.year}</span>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
            container.innerHTML += sectionHtml;
        }

        // --- BUSCA ---
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) doSearch(e.target.value.trim());
        });

        async function doSearch(query) {
            updateUrl('p', query);
            const container = document.getElementById('app-container');
            container.innerHTML = '<div class="section-title">Resultados da Pesquisa</div>';
            document.getElementById('details-view').style.display = 'none';
            container.style.display = 'block';

            const data = await fetchApi(`/v1/search?s=${query}`);
            
            if (data && data.results && data.results.length > 0) {
                const gridHtml = `
                    <div style="display: flex; flex-wrap: wrap; gap: 20px; padding: 0 4%;">
                        ${data.results.map(item => `
                            <div class="card" onclick="onItemClick('${item.url}')" style="flex: 0 0 160px;">
                                <img src="${item.thumb || 'https://via.placeholder.com/160x240'}" alt="${item.title}">
                            </div>
                        `).join('')}
                    </div>
                `;
                container.innerHTML += gridHtml;
            } else {
                container.innerHTML += '<p style="padding: 0 4%; color: #999;">Nenhum resultado encontrado.</p>';
            }
        }

        // --- DETALHES ---
        function onItemClick(url) {
            const urlObj = new URL(window.location);
            urlObj.searchParams.delete('p');
            urlObj.searchParams.set('view', 'info');
            urlObj.searchParams.set('url', url);
            window.history.pushState({}, '', urlObj);
            loadDetails(url);
        }

        async function loadDetails(url) {
            document.getElementById('app-container').style.display = 'none';
            const detailsView = document.getElementById('details-view');
            detailsView.style.display = 'block';
            window.scrollTo(0,0);

            const data = await fetchApi(`/v1/info?url=${url}`);
            if (!data) return;

            document.getElementById('detailsBg').style.backgroundImage = `url('${data.thumb}')`;
            document.getElementById('detPoster').src = data.thumb;
            document.getElementById('detTitle').innerText = data.title;
            document.getElementById('detYear').innerText = data.year || '';
            document.getElementById('detImdb').innerText = `IMDB ${data.imdb || 'N/A'}`;
            document.getElementById('detType').innerText = data.is_series ? 'Série' : 'Filme';
            document.getElementById('detDesc').innerText = data.description || 'Sem descrição.';

            const actionArea = document.getElementById('action-area');
            const episodesArea = document.getElementById('episodesArea');
            const epList = document.getElementById('epList');
            
            actionArea.innerHTML = '';
            episodesArea.style.display = 'none';
            epList.innerHTML = '';

            const btnBack = document.createElement('button');
            btnBack.className = 'btn-action btn-back';
            btnBack.innerText = '⬅ Voltar';
            btnBack.onclick = () => window.history.back();
            actionArea.appendChild(btnBack);

            if (data.is_series) {
                episodesArea.style.display = 'block';
                if (data.episodes && data.episodes.length > 0) {
                    data.episodes.forEach(ep => {
                        const card = document.createElement('div');
                        card.className = 'ep-card';
                        card.innerHTML = `<span class="ep-name">🎬 ${ep.name}</span>`;
                        card.onclick = () => openPlayer(ep.player_id, true);
                        epList.appendChild(card);
                    });
                }
            } else {
                const btnPlay = document.createElement('button');
                btnPlay.className = 'btn-action btn-play';
                btnPlay.innerHTML = '▶ Assistir Filme';
                btnPlay.onclick = () => openPlayer(data.watch_link, false);
                actionArea.appendChild(btnPlay);
            }
        }

        function openPlayer(idOrPath, isSeries) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('iframePlayer');
            let src = isSeries ? `${API_BASE}/v1/watch/${idOrPath}` : (idOrPath.startsWith('/') ? `${API_BASE}${idOrPath}` : `${API_BASE}/v1/watch/${idOrPath}`);
            iframe.src = src;
            modal.style.display = 'block';
        }

        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('iframePlayer').src = '';
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
