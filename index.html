<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVFLIX - Filmes, Séries e Animes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #141414;
            --bg-card: #2f2f2f;
            --primary: #e50914;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --modal-bg: #181818;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--primary) #333; }

        body {
            background-color: var(--bg-body);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 4%;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 100; transition: background 0.4s;
        }
        nav.black { background-color: #000; }

        .logo { font-size: 2rem; font-weight: 800; cursor: pointer; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .logo .jv { color: #fff; }
        .logo .flix { color: var(--primary); }

        .nav-menu { display: flex; gap: 20px; list-style: none; }
        .nav-menu li { cursor: pointer; color: #ccc; transition: 0.3s; }
        .nav-menu li:hover { color: #fff; }

        .search-box input {
            background: rgba(0,0,0,0.7); border: 1px solid #555;
            color: #fff; padding: 8px 15px; border-radius: 4px; outline: none;
        }

        /* --- HERO --- */
        .hero {
            height: 80vh; width: 100%;
            background-size: cover; background-position: center;
            position: relative; display: flex; align-items: center; padding-left: 4%;
        }
        .hero::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, var(--bg-body) 10%, transparent 90%);
        }
        .hero-content { position: relative; z-index: 2; max-width: 600px; }
        .hero-title { font-size: 3.5rem; margin-bottom: 15px; text-shadow: 2px 2px 4px #000; }
        .hero-desc { font-size: 1.1rem; color: #ddd; margin-bottom: 20px; line-height: 1.5; text-shadow: 1px 1px 2px #000; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;}
        
        .btn { padding: 10px 25px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px;}
        .btn-play { background: #fff; color: #000; }
        .btn-play:hover { background: #ddd; }

        /* --- ROWS --- */
        .row { padding: 20px 4%; }
        .row-title { font-size: 1.3rem; margin-bottom: 10px; font-weight: 600; }
        .slider { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; }
        
        .card {
            flex: 0 0 auto; width: 160px; height: 240px;
            border-radius: 4px; overflow: hidden; cursor: pointer;
            transition: transform 0.3s; position: relative;
        }
        .card:hover { transform: scale(1.08); z-index: 10; }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* --- MODAL PLAYER (COMPLEXO) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000; overflow-y: auto;
        }
        
        .modal-content {
            width: 90%; max-width: 1100px; margin: 40px auto;
            background: var(--modal-bg); border-radius: 8px; overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Área do Iframe */
        .player-wrapper {
            position: relative; padding-bottom: 56.25%; /* 16:9 */
            height: 0; background: #000;
        }
        .player-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        /* Área de Controle da Série */
        .series-area { padding: 20px; display: none; } /* Oculto por padrão, aparece se for série */
        .series-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        
        .season-select {
            padding: 10px; background: #333; color: #fff; border: 1px solid #555;
            border-radius: 4px; font-size: 1rem; outline: none; cursor: pointer;
        }

        .episodes-list {
            display: flex; flex-direction: column; gap: 10px;
            max-height: 400px; overflow-y: auto;
            padding-right: 10px;
        }

        .episode-item {
            display: flex; align-items: center; gap: 15px;
            background: #222; padding: 10px; border-radius: 4px;
            cursor: pointer; transition: background 0.2s;
            border: 1px solid transparent;
        }
        .episode-item:hover { background: #333; }
        .episode-item.active { border-color: var(--primary); background: #2a2a2a; }

        .ep-img { width: 120px; height: 68px; object-fit: cover; border-radius: 4px; background: #000; }
        .ep-info { flex: 1; }
        .ep-title { font-weight: bold; font-size: 1rem; margin-bottom: 4px; }
        .ep-desc { font-size: 0.85rem; color: #aaa; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .close-modal {
            position: fixed; top: 20px; right: 30px; font-size: 2.5rem;
            color: #fff; cursor: pointer; z-index: 2001; text-shadow: 0 0 5px #000;
        }

        @media(max-width: 768px) {
            .hero-title { font-size: 2rem; }
            .card { width: 120px; height: 180px; }
            .episode-item { flex-direction: column; align-items: flex-start; }
            .ep-img { width: 100%; height: auto; aspect-ratio: 16/9; }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="logo" onclick="location.reload()">
            <span class="jv">JV</span><span class="flix">FLIX</span>
        </div>
        <ul class="nav-menu">
            <li onclick="loadSection('all')">Início</li>
            <li onclick="loadSection('movie')">Filmes</li>
            <li onclick="loadSection('tv')">Séries</li>
            <li onclick="loadSection('anime')">Animes</li>
        </ul>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquisar...">
        </div>
    </nav>

    <!-- Hero -->
    <div class="hero" id="hero">
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">Carregando...</h1>
            <p class="hero-desc" id="heroOverview"></p>
            <button class="btn btn-play" id="heroBtn">▶ Assistir</button>
        </div>
    </div>

    <!-- Conteúdo -->
    <div id="content-container" style="margin-top: -50px; position: relative; z-index: 10;"></div>

    <!-- Modal Player Avançado -->
    <div class="modal-overlay" id="modal">
        <span class="close-modal" onclick="closePlayer()">×</span>
        <div class="modal-content">
            <!-- Player -->
            <div class="player-wrapper">
                <!-- Sandbox removido conforme solicitado (permite redirecionamentos) -->
                <iframe id="videoPlayer" allowfullscreen></iframe>
            </div>

            <!-- Área exclusiva para Séries -->
            <div class="series-area" id="seriesArea">
                <div class="series-header">
                    <h3 id="seriesTitleModal">Escolha o Episódio</h3>
                    <select id="seasonSelect" class="season-select" onchange="changeSeason(this.value)"></select>
                </div>
                <div class="episodes-list" id="episodesList">
                    <!-- Lista de episódios gerada via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '1e448e0dfcdbb565f5d329820065b4d2'; 
        const TMDB_BASE = 'https://api.themoviedb.org/3';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
        const HERO_BASE = 'https://image.tmdb.org/t/p/original';
        const SUPERFLIX = 'https://superflixapi.cv';

        // Estado Global
        let currentTvId = null;

        // --- Inicialização ---
        window.onload = () => loadSection('all');
        window.onscroll = () => {
            const nav = document.getElementById('navbar');
            nav.classList.toggle('black', window.scrollY > 50);
        };

        // --- Buscador de Dados ---
        async function fetchApi(endpoint) {
            const separator = endpoint.includes('?') ? '&' : '?';
            try {
                const res = await fetch(`${TMDB_BASE}${endpoint}${separator}api_key=${API_KEY}&language=pt-BR`);
                return await res.json();
            } catch (err) { console.error(err); return {}; }
        }

        // --- Construção da Home ---
        async function loadSection(type) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';
            
            // Define o Hero inicial
            const trending = await fetchApi('/trending/all/day');
            if(trending.results) setupHero(trending.results[0]);

            // Carrega fileiras baseadas na escolha
            if(type === 'all') {
                createRow('Em Alta na JVFLIX', '/trending/all/week');
                createRow('Filmes de Ação', '/discover/movie?with_genres=28');
                createRow('Séries Populares', '/tv/popular');
                createRow('Animes', '/discover/tv?with_genres=16&with_original_language=ja&sort_by=popularity.desc');
            } else if (type === 'movie') {
                createRow('Filmes Populares', '/movie/popular');
                createRow('Melhor Avaliados', '/movie/top_rated');
                createRow('Terror', '/discover/movie?with_genres=27');
            } else if (type === 'tv') {
                createRow('Séries do Momento', '/tv/popular');
                createRow('Novos Episódios', '/tv/on_the_air');
            } else if (type === 'anime') {
                createRow('Animes Populares', '/discover/tv?with_genres=16&with_original_language=ja&sort_by=popularity.desc');
                createRow('Filmes de Anime', '/discover/movie?with_genres=16&with_original_language=ja');
            }
        }

        function setupHero(item) {
            const bg = item.backdrop_path ? `${HERO_BASE}${item.backdrop_path}` : '';
            document.getElementById('hero').style.backgroundImage = `url('${bg}')`;
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroOverview').innerText = item.overview;
            
            const type = item.media_type || (item.first_air_date ? 'tv' : 'movie');
            document.getElementById('heroBtn').onclick = () => openPlayer(type, item.id);
        }

        async function createRow(title, endpoint) {
            const data = await fetchApi(endpoint);
            if(!data.results) return;

            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `<div class="row-title">${title}</div>`;
            
            const slider = document.createElement('div');
            slider.className = 'slider';

            data.results.forEach(item => {
                if(!item.poster_path) return;
                const card = document.createElement('div');
                card.className = 'card';
                const type = item.media_type || (item.title ? 'movie' : 'tv'); // Detecção fallback
                
                card.innerHTML = `<img src="${IMG_BASE}${item.poster_path}" alt="${item.title || item.name}">`;
                card.onclick = () => openPlayer(type, item.id);
                slider.appendChild(card);
            });

            row.appendChild(slider);
            document.getElementById('content-container').appendChild(row);
        }

        // --- SISTEMA DE PLAYER E EPISÓDIOS ---
        
        async function openPlayer(type, id) {
            const modal = document.getElementById('modal');
            const iframe = document.getElementById('videoPlayer');
            const seriesArea = document.getElementById('seriesArea');
            
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Trava scroll do site

            if(type === 'movie') {
                // Configuração para Filme
                seriesArea.style.display = 'none';
                iframe.src = `${SUPERFLIX}/movie/${id}`;
            } else {
                // Configuração para Série
                seriesArea.style.display = 'block';
                currentTvId = id;
                iframe.src = ''; // Limpa player enquanto carrega dados
                await loadSeriesDetails(id);
            }
        }

        async function loadSeriesDetails(id) {
            const data = await fetchApi(`/tv/${id}`);
            const select = document.getElementById('seasonSelect');
            const seriesTitle = document.getElementById('seriesTitleModal');
            
            seriesTitle.innerText = `${data.name} - Episódios`;
            select.innerHTML = ''; // Limpa anteriores

            // Preenche o Select com as Temporadas
            data.seasons.forEach(season => {
                // Filtra temporada 0 (especiais) se quiser, ou mantém
                if (season.season_number > 0) {
                    const opt = document.createElement('option');
                    opt.value = season.season_number;
                    opt.innerText = `Temporada ${season.season_number}`;
                    select.appendChild(opt);
                }
            });

            // Carrega automaticamente a Temporada 1 (ou a primeira disponível)
            if(select.options.length > 0) {
                changeSeason(select.options[0].value);
            }
        }

        async function changeSeason(seasonNum) {
            const list = document.getElementById('episodesList');
            list.innerHTML = '<p style="color:#fff; padding:10px;">Carregando episódios...</p>';
            
            const data = await fetchApi(`/tv/${currentTvId}/season/${seasonNum}`);
            list.innerHTML = ''; // Limpa loading

            if(data.episodes) {
                data.episodes.forEach(ep => {
                    const div = document.createElement('div');
                    div.className = 'episode-item';
                    
                    // Imagem do episódio (ou placeholder)
                    const imgUrl = ep.still_path ? `${IMG_BASE}${ep.still_path}` : 'https://via.placeholder.com/150x85/333/fff?text=No+Image';
                    
                    div.innerHTML = `
                        <img src="${imgUrl}" class="ep-img" alt="Ep ${ep.episode_number}">
                        <div class="ep-info">
                            <div class="ep-title">${ep.episode_number}. ${ep.name}</div>
                            <div class="ep-desc">${ep.overview || 'Sem descrição.'}</div>
                        </div>
                    `;

                    // Clique no episódio toca o vídeo
                    div.onclick = () => {
                        playEpisode(seasonNum, ep.episode_number);
                        // Remove active dos outros e adiciona neste
                        document.querySelectorAll('.episode-item').forEach(el => el.classList.remove('active'));
                        div.classList.add('active');
                    };

                    list.appendChild(div);
                });

                // Opcional: Tocar o primeiro episódio automaticamente ao trocar de temporada?
                // playEpisode(seasonNum, 1);
            }
        }

        function playEpisode(season, episode) {
            const iframe = document.getElementById('videoPlayer');
            iframe.src = `${SUPERFLIX}/serie/${currentTvId}/${season}/${episode}`;
        }

        function closePlayer() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
            document.body.style.overflow = 'auto'; // Destrava scroll
        }

        // --- Busca ---
        document.getElementById('searchInput').addEventListener('keypress', async (e) => {
            if(e.key === 'Enter') {
                const query = e.target.value;
                if(!query) return;
                
                const container = document.getElementById('content-container');
                container.innerHTML = ''; // Limpa tudo
                
                // Cria grid de resultados
                const res = await fetchApi(`/search/multi?query=${query}`);
                
                const gridTitle = document.createElement('h2');
                gridTitle.className = 'row-title';
                gridTitle.style.paddingLeft = '4%';
                gridTitle.innerText = `Resultados para: "${query}"`;
                container.appendChild(gridTitle);

                const grid = document.createElement('div');
                grid.style.display = 'flex'; grid.style.flexWrap = 'wrap'; grid.style.gap = '20px'; grid.style.padding = '0 4%';
                
                res.results.forEach(item => {
                    if(!item.poster_path) return;
                    const card = document.createElement('div');
                    card.className = 'card';
                    const type = item.media_type;
                    card.innerHTML = `<img src="${IMG_BASE}${item.poster_path}">`;
                    card.onclick = () => openPlayer(type, item.id);
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }
        });
    </script>
</body>
</html>
